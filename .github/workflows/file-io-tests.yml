name: File IO Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  file-io:
    name: FileSource FileSink Debayer CCM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build python3 libeigen3-dev
      - name: Cache OpenCV 4.12.0
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/opencv/4.12.0/linux-x86_64
          key: opencv-4.12.0-file-io-${{ runner.os }}-${{ runner.arch }}
      - name: Install OpenCV 4.12.0
        run: .github/scripts/install-opencv-4.12.0.sh ${{ github.workspace }}/opencv/4.12.0/linux-x86_64 ${{ github.workspace }}/opencv/4.12.0/build-linux-x86_64
      - name: Configure runtime
        run: |
          cmake -S . -B build-runtime -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_RUNTIME=ON \
            -DENABLE_GSTREAMER=OFF \
            -DOpenCV_DIR=${{ github.workspace }}/opencv/4.12.0/linux-x86_64/lib/cmake/opencv4
      - name: Build runtime
        run: cmake --build build-runtime --parallel
      - name: Run file IO tests
        run: tests/scripts/test_fileio_nodes.sh build-runtime/camflow
