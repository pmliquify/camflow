name: Release Candidate

# Builds the exact same artifacts as the Release workflow, but without
# creating a tag or publishing a GitHub release. Development happens on
# develop, so every push there produces downloadable artifacts for testing
# before a stable release is merged to master and tagged "v*.*.*".
on:
  workflow_dispatch: {}
  push:
    branches:
      - develop
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

# Only keep the artifacts of the latest push per branch; older builds are moot.
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    uses: ./.github/workflows/build-release-package.yml
    with:
      version: rc-${{ github.sha }}
