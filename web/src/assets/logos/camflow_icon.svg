<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">CamFlow App Icon</title>
  <desc id="desc">Modern CamFlow icon with a camera lens, C-shaped gradient arc and flow lines on a dark rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24364f"/>
      <stop offset="55%" stop-color="#16263a"/>
      <stop offset="100%" stop-color="#0b1727"/>
    </linearGradient>
    <linearGradient id="accent" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0%" stop-color="#37b8ff"/>
      <stop offset="52%" stop-color="#2ec6e3"/>
      <stop offset="100%" stop-color="#47de88"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#9d7bff"/>
      <stop offset="22%" stop-color="#5233a4"/>
      <stop offset="48%" stop-color="#13152d"/>
      <stop offset="72%" stop-color="#0b2830"/>
      <stop offset="100%" stop-color="#19c9bd"/>
    </radialGradient>
    <radialGradient id="lensCore" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#d7d2ff"/>
      <stop offset="16%" stop-color="#6e56d7"/>
      <stop offset="45%" stop-color="#1a1c38"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="ringMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8b2c2"/>
      <stop offset="48%" stop-color="#596579"/>
      <stop offset="100%" stop-color="#263244"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="42" y="42" width="940" height="940" rx="180" fill="url(#bg)"/>
  <ellipse cx="510" cy="790" rx="280" ry="86" fill="#000" opacity="0.16" filter="url(#soft)"/>

  <!-- C-shaped brand arc -->
  <path d="M 683 307
           A 274 274 0 1 0 714 704"
        fill="none"
        stroke="url(#accent)"
        stroke-width="78"
        stroke-linecap="round"
        filter="url(#shadow)"/>

  <!-- Camera lens -->
  <g filter="url(#shadow)">
    <circle cx="505" cy="520" r="168" fill="#111926" stroke="#0b1019" stroke-width="18"/>
    <circle cx="505" cy="520" r="144" fill="url(#ringMetal)" stroke="#c0c8d5" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="505" cy="520" r="126" fill="#0a0f18" stroke="#03060c" stroke-width="8"/>
    <circle cx="505" cy="520" r="108" fill="url(#lensGlass)" stroke="#1a2331" stroke-width="10"/>
    <circle cx="505" cy="520" r="82" fill="#0b1020" opacity="0.82"/>
    <circle cx="505" cy="520" r="62" fill="url(#lensCore)" stroke="#1c2636" stroke-width="7"/>
    <circle cx="505" cy="520" r="28" fill="#070b14"/>
    <ellipse cx="468" cy="471" rx="24" ry="13" fill="#ffffff" opacity="0.45" transform="rotate(-35 468 471)"/>
    <ellipse cx="490" cy="490" rx="9" ry="5" fill="#ffffff" opacity="0.28" transform="rotate(-35 490 490)"/>
  </g>

  <!-- Flow lines -->
  <g fill="url(#accent)" filter="url(#shadow)">
    <rect x="672" y="380" width="150" height="18" rx="9"/>
    <rect x="677" y="425" width="102" height="18" rx="9"/>
    <rect x="807" y="425" width="70" height="18" rx="9"/>
    <rect x="690" y="470" width="158" height="18" rx="9"/>
    <rect x="705" y="515" width="176" height="18" rx="9"/>
    <rect x="695" y="560" width="164" height="18" rx="9"/>
    <rect x="675" y="605" width="110" height="18" rx="9"/>
    <rect x="810" y="605" width="46" height="18" rx="9"/>
  </g>
</svg>
